syntax = "proto3";
package ai.medprice.api;

import "scalapb/scalapb.proto";

option java_multiple_files = true;
option java_package = "ai.medprice.api";
option java_outer_classname = "PriceTermsProto";
option (scalapb.options) = {
  scala3_sources: true
};

// The terms a price was filed under (#1567), shared by the payer code-cost and
// provider code-cost APIs. Every figure is for one set of terms, never a
// blend: a facility fee and a professional fee are separate bills (#1543), a
// per diem is a price per day and a case rate one for the whole stay, and an
// inpatient price isn't an outpatient one.

// CMS's billing class. BILLING_CLASS_BOTH is a class of its own (CMS doesn't
// define it), never the sum of the other two.
enum BillingClass {
  // None filed: the price can't be assumed to be either class.
  BILLING_CLASS_UNSPECIFIED = 0;
  BILLING_CLASS_PROFESSIONAL = 1;
  BILLING_CLASS_FACILITY = 2;
  BILLING_CLASS_BOTH = 3;
  // Filed as a value outside the CMS set; PriceTerms.billing_class_filed has
  // the text.
  BILLING_CLASS_UNKNOWN = 4;
}

// CMS's standard-charge methodology.
enum Methodology {
  // None filed.
  METHODOLOGY_UNSPECIFIED = 0;
  METHODOLOGY_CASE_RATE = 1;
  METHODOLOGY_FEE_SCHEDULE = 2;
  // CMS's own "other" value, not an unrecognized one.
  METHODOLOGY_OTHER = 3;
  METHODOLOGY_PERCENT_OF_TOTAL_BILLED_CHARGES = 4;
  METHODOLOGY_PER_DIEM = 5;
  // Filed as a value outside the CMS set; PriceTerms.methodology_filed has the
  // text.
  METHODOLOGY_UNKNOWN = 6;
}

// CMS's setting.
enum Setting {
  // None filed.
  SETTING_UNSPECIFIED = 0;
  SETTING_INPATIENT = 1;
  SETTING_OUTPATIENT = 2;
  SETTING_BOTH = 3;
  // Filed as a value outside the CMS set; PriceTerms.setting_filed has the
  // text.
  SETTING_UNKNOWN = 4;
}

// The billing class, methodology and setting a figure is for. Each *_filed
// field is the text as filed when its enum is *_UNKNOWN, and empty otherwise,
// so nothing a hospital filed is lost.
message PriceTerms {
  BillingClass billing_class = 1;
  string billing_class_filed = 2;
  Methodology methodology = 3;
  string methodology_filed = 4;
  Setting setting = 5;
  string setting_filed = 6;
}

// Narrows prices to one billing class, methodology and/or setting. An unset
// field means any; *_UNSPECIFIED selects the prices with none filed; *_UNKNOWN
// is INVALID_ARGUMENT (an unrecognized value can't be named). Results are
// split by PriceTerms whatever the filter, so leaving it unset never blends
// one set of terms with another.
message PriceTermsFilter {
  optional BillingClass billing_class = 1;
  optional Methodology methodology = 2;
  optional Setting setting = 3;
}

// How a hospital's charges for a code are combined into rows (#1849), shared by
// every provider RPC that returns figures. A request
// has two sibling fields that work in this order:
//
//   group_by  decides which rows exist (how the hospital's charges are pooled).
//   filter    then keeps only some of those rows (a WHERE on the grouped rows).
//
// A term is one of billing class, methodology and setting (PriceTerms). A
// hospital files a code under one or more combinations of them. Stored per
// combination, and pooled again by billing class, by methodology and over
// everything, each pool with an exact median and standard deviation (a median
// can't be combined from smaller ones). A facility fee is never pooled with a
// professional one unless the grouping is ALL (#1543).
//
// Example. Hospital H files CPT 99213 under three combinations:
//
//   #  billing class  methodology    setting     median
//   1  facility       fee schedule   outpatient  $100
//   2  facility       case rate      outpatient  $150
//   3  professional   fee schedule   outpatient  $80
//
// group_by alone:
//   PER_COMBINATION  3 rows: #1, #2, #3.
//   BILLING_CLASS    2 rows: facility (#1 and #2 pooled), professional (#3).
//   METHODOLOGY      2 rows: fee schedule (#1 and #3 pooled), case rate (#2).
//   ALL              1 row: #1, #2 and #3 pooled; no terms set.
//
// group_by then filter:
//   BILLING_CLASS + billing_class = facility    1 row: facility (#1 + #2).
//   METHODOLOGY + methodology = case rate       1 row: case rate (#2).
//   PER_COMBINATION + billing_class = facility  2 rows: #1 and #2.
//   BILLING_CLASS + methodology = case rate     INVALID_ARGUMENT: grouping by
//     billing class pooled the methodologies away, so none is left to match.
//   ALL, no filter                              1 row: #1, #2 and #3 pooled.
//   ALL + billing_class = facility              INVALID_ARGUMENT: ALL pooled
//     the billing classes away too. ALL keeps no terms, so it takes no filter
//     at all; to see only facility charges, group by BILLING_CLASS instead.
//
// Across hospitals (ListCodeProviderHospitals) the filter decides who is listed
// and with what: BILLING_CLASS + billing_class = facility lists each hospital's
// facility figure, and a hospital with only professional rows isn't listed. A
// distribution needs one figure per hospital, so there the filter must name
// every term the grouping keeps (BILLING_CLASS + a billing class; ALL with no
// filter), else INVALID_ARGUMENT.
//
// So the filter may only name the terms the grouping still tells rows apart by:
// all three for PER_COMBINATION, the billing class for BILLING_CLASS, the
// methodology for METHODOLOGY, none for ALL. No pool by setting, or by a billing
// class and a methodology together, is built.
enum GroupBy {
  // One row per billing class, methodology and setting, the default.
  GROUP_BY_PER_COMBINATION = 0;
  // One row per billing class, pooled over methodologies and settings; each
  // row's terms name only the billing class.
  GROUP_BY_BILLING_CLASS = 1;
  // One row per methodology, pooled over billing classes and settings; each
  // row's terms name only the methodology.
  GROUP_BY_METHODOLOGY = 2;
  // One row: the figure over every set of terms the hospital files the code
  // under, its terms all unset. It blends billing classes.
  GROUP_BY_ALL = 3;
}
