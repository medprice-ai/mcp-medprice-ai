syntax = "proto3";
package ai.medprice.api;

import "scalapb/scalapb.proto";

option java_multiple_files = true;
option java_package = "ai.medprice.api";
option java_outer_classname = "HospitalCodeCostProto";
option (scalapb.options) = {
  scala3_sources: true
};

message HospitalCodeCostRequest {
  // Opaque handle from HospitalRecord.hospital_id returned by ListHospitals -
  // backed by public.hospital.id, the stable id that persists across
  // revisions. Distinct from public.hospital_revision.id, which is never
  // exposed over gRPC; the server resolves this to that hospital's latest
  // revision internally.
  string hospital_id = 1;
  // e.g. "MS-DRG"
  string code_type = 2;
  // e.g. "652"
  string code = 3;
  // Methodology db strings to price, e.g. ["case rate", "per diem"] - see
  // core.api.Methodology.knownMethodologies. Empty (the common case) means
  // "aggregate across all methodologies", returning exactly one result
  // (methodology left empty) - same as the old singular empty-string
  // convention this field replaces (issue #627). A non-empty list returns
  // one entry per requested methodology, in request order, each with
  // found=false when this hospital didn't report that methodology for this
  // code, rather than omitting it - letting a caller request every known
  // methodology in one call instead of the 1-aggregate-plus-5-per-methodology
  // fan-out this replaces. Every element must be one of the known db
  // strings; an unrecognized one is rejected with INVALID_ARGUMENT.
  repeated string methodologies = 4;
  // Optional. Empty (default) resolves hospital_id to its latest revision,
  // same as before this field existed. When set, must be one of the
  // revision_ids returned for this hospital_id under
  // HospitalRecord.revisions - prices that specific past
  // revision instead of the latest one.
  string revision_id = 5;
}

// PROTOTYPE (#870): one (code_type, code) entry in a
// HospitalCodeCostBatchRequest.
message CodeRef {
  // e.g. "MS-DRG"
  string code_type = 1;
  // e.g. "652"
  string code = 2;
  // Same convention/semantics as HospitalCodeCostRequest.methodologies -
  // empty (the common case) means "aggregate across all methodologies" for
  // this code, returning exactly one result; a non-empty list returns one
  // entry per requested methodology for this code. Every element must be a
  // known db string (see core.api.Methodology.knownMethodologies); an
  // unrecognized one is rejected with INVALID_ARGUMENT.
  repeated string methodologies = 3;
}

// PROTOTYPE (#870): batch counterpart to HospitalCodeCostRequest - prices
// several (code_type, code) pairs for one hospital_id in a single RPC,
// instead of one GetHospitalCodeCost call per code. Aimed at
// medprice-ai-web's getProcedureCostPointsForHospital (lib/procedureCosts.ts),
// which currently fires one GetHospitalCodeCost per entry in its ~36-entry
// PROCEDURES pool on every hospital-detail-page ISR revalidation.
// CodeRef.methodologies carries the same per-request methodology filter
// HospitalCodeCostRequest.methodologies does, scoped per code - the common
// empty-methodologies case (the page fan-out this replaces only ever wants
// the aggregate) is served by one batched Parquet scan across every code in
// the request (ParquetCodeCostReader.findCostsForCodes); a code that
// requests 2+ methodologies falls back to one
// ParquetCodeCostReader.findCostsByMethodology call for just that code
// (the same GROUPING SETS query GetHospitalCodeCost's own multi-methodology
// case uses) since batching a per-code methodology breakdown into one scan
// isn't implemented yet.
message HospitalCodeCostBatchRequest {
  // Same convention as HospitalCodeCostRequest.hospital_id.
  string hospital_id = 1;
  // Capped at 100 entries (HospitalCodeCostServiceImpl.MaxBatchCodes) -
  // rejected with INVALID_ARGUMENT above that, rather than silently
  // truncated, since this is a public unauthenticated backend and an
  // uncapped list would let a caller force an arbitrarily wide scan.
  repeated CodeRef codes = 2;
  // Same convention as HospitalCodeCostRequest.revision_id.
  string revision_id = 3;
}

// PROTOTYPE (#870): one entry per requested CodeRef, in request order -
// found=false (not omitted) when this hospital has no data for that code,
// mirroring HospitalCodeCostRequest.methodologies' per-entry found
// convention.
message HospitalCodeCostBatchResponse {
  repeated HospitalCostResult results = 1;
}

message CodeCostStatsMessage {
  string code_type = 1;
  string code = 2;
  string min = 3;
  string max = 4;
  string avg = 5;
  string median = 6;
  string std_dev = 7;
  // Sum, across every payer row contributing to this stat, of CMS's
  // "Count of Allowed Amounts" (see core.api.CountOfAllowedAmounts) - a
  // range, not a single number, because CMS's spec de-identifies a
  // 1-10-remittance count into the literal string "1 through 10" rather
  // than reporting the real value (issue #719). sample_count_sum_min sums
  // 1 for each such de-identified row (its known lower bound);
  // sample_count_sum_max sums 10 for each (its known upper bound). Every
  // other contributing row (an exact count, or a literal 0) contributes the
  // same value to both. A hospital reporting no sample_count data at all
  // for this code yields 0/0/true here - indistinguishable from a genuine
  // all-zero result, since CMS's spec allows both.
  int64 sample_count_sum_min = 8;
  int64 sample_count_sum_max = 9;
  // True iff sample_count_sum_min == sample_count_sum_max, i.e. every
  // contributing row was an exact count (or 0) - no de-identified
  // "1 through 10" row narrowed this to a range.
  bool sample_count_exact = 10;
}

message HospitalDescription {
  string hospital_name = 1;
  string location = 2;
  string code_description = 3;
  string methodology_note = 4;
}

message MethodologyCostResult {
  // Methodology db string this entry is scoped to, e.g. "case rate" - see
  // core.api.Methodology. Empty when aggregated across all methodologies
  // (the request's methodology filter, singular or repeated, was left
  // empty).
  string methodology = 1;
  // proto3 "optional" gives this scalar field explicit presence, so JSON
  // marshaling (e.g. grpcurl) always emits it, even when false.
  optional bool found = 2;
  CodeCostStatsMessage cost = 3;
  HospitalDescription description = 4;
}

message HospitalCostResult {
  string hospital = 1;
  // True if at least one entry in `results` was found.
  optional bool found = 2;
  // Opaque handle backed by public.hospital.id, same convention as
  // HospitalRecord.hospital_id - lets a client link this result back to a
  // hospital detail page without a separate ListHospitals lookup.
  string hospital_id = 3;
  // One entry per requested methodology, in request order (see
  // HospitalCodeCostRequest.methodologies) - or, for ListHospitalCodeCosts
  // (whose methodology filter stays singular) and an empty methodology
  // filter, exactly one entry. Always non-empty for a resolved hospital -
  // see issue #627.
  repeated MethodologyCostResult results = 4;
}

message ListHospitalCodeCostsRequest {
  // e.g. "MS-DRG"
  string code_type = 1;
  // e.g. "652"
  string code = 2;
  // Methodology db string, e.g. "case rate". Empty means "all methodologies".
  string methodology = 3;
  // Maximum number of results to return. Defaults to 500, capped at 500 -
  // comfortably covers the whole current registry (~330 hospitals) in one
  // call, since an LLM caller can't be relied on to always notice
  // next_page_token and continue (see issue #163).
  int32 page_size = 4;
  // Opaque token returned by a previous ListHospitalCodeCosts call. Empty for the first page.
  string page_token = 5;
}

message ListHospitalCodeCostsResponse {
  // One entry per hospital with a matching chargemaster entry (its latest
  // revision only) - hospitals with no data for this code are simply
  // omitted, not returned with found=false.
  repeated HospitalCostResult results = 1;
  // Empty when there are no more results.
  string next_page_token = 2;
  // Total number of matching hospitals across all pages - lets a caller
  // sanity-check "got N of total_count" instead of only seeing
  // next_page_token and having to infer there's more (see issue #163).
  int32 total_count = 3;
}

message ListCodeTypesRequest {
}

message CodeTypeSummary {
  // e.g. "CPT" - see core.api.CodeType.
  string code_type = 1;
  // Distinct codes catalogued under this type.
  int32 code_count = 2;
  // Sum of hospital_count across every code under this type - NOT a
  // distinct-hospital count (a hospital reporting many codes under one type
  // is counted once per code). See CodeTypeSummary's Scala doc comment.
  int32 total_hospital_reports = 3;
}

message ListCodeTypesResponse {
  // One entry per distinct code_type present in public.code_catalog, most
  // code-rich first. Unpaginated - the number of distinct code types is
  // small and bounded (see core.api.CodeType).
  repeated CodeTypeSummary code_types = 1;
}

enum CodeSort {
  // Code-alphabetical - the original, and still default, ordering.
  CODE_SORT_UNSPECIFIED = 0;
  // Most hospitals reporting first - lets a caller (e.g. a
  // /codes/[codeType] page) get pre-sorted "top codes" pages in one round
  // trip instead of fetching every page and sorting client-side (#399).
  CODE_SORT_HOSPITAL_COUNT_DESC = 1;
  // Largest pricing sample size first (CodeSummary.total_sample_count_max)
  // - ranks by how many billing records actually back a code's pricing,
  // rather than by how many hospitals merely report it (#818).
  CODE_SORT_SAMPLE_COUNT_DESC = 2;
  // Code-alphabetical, reverse order - the mirror image of the default
  // CODE_SORT_UNSPECIFIED ordering (#822).
  CODE_SORT_CODE_DESC = 3;
  // Best text match first: exact code, then code prefix, then description
  // word-start, then description substring; ties broken by
  // total_sample_count_max DESC (#911). Only meaningful when
  // ListCodesRequest.query is set, and is the default ordering in that case
  // (an explicit non-relevance sort still applies to the matching rows).
  // Without a query it behaves like CODE_SORT_SAMPLE_COUNT_DESC.
  CODE_SORT_RELEVANCE = 4;
}

message ListCodesRequest {
  // e.g. "CPT"
  string code_type = 1;
  // Maximum number of results to return. Defaults to 500, capped at 500 -
  // same convention as ListHospitalCodeCostsRequest.page_size.
  int32 page_size = 2;
  // Opaque token returned by a previous ListCodes call. Empty for the first page.
  string page_token = 3;
  // Defaults to CODE_SORT_UNSPECIFIED (code-alphabetical) - see #399.
  CodeSort sort = 4;
  // Optional case-insensitive text search (#911): matches the code as a
  // prefix, and substrings of raw_description and friendly_description.
  // Descriptions are only searched for queries of 4+ characters; shorter
  // queries match the code prefix only (a 1-3 character substring matches
  // too many descriptions to rank fast enough for per-keystroke use).
  // Blank/whitespace-only is treated as unset. When set, code_type may be
  // left empty to search across code types (hospital-specific CDM and LOCAL
  // codes are excluded from that cross-type search - name them in code_type
  // to search them), and CodeSummary.code_type tells the hits apart.
  // total_count counts matches only. page_token is only valid with the same
  // query/code_type/sort it was issued for.
  string query = 5;
}

message CodeSummary {
  string code = 1;
  // Raw chargemaster text, MODE()-picked across reporting hospitals - same
  // caveat as HospitalDescription.code_description (see issue #266: this is
  // not a human-readable procedure name).
  string raw_description = 2;
  // Distinct hospitals reporting this code (latest revision only) - lets a
  // caller decide what's worth a page/link for, rather than the server
  // imposing a fixed threshold (see issue #286).
  int32 hospital_count = 3;
  // Sum of every reporting hospital's sample_count_sum_min (see
  // CodeCostStatsMessage), as a [total_sample_count_min,
  // total_sample_count_max] range - same de-identified-range semantics as
  // CodeCostStatsMessage's fields (issue #818).
  int64 total_sample_count_min = 4;
  int64 total_sample_count_max = 5;
  // True iff total_sample_count_min == total_sample_count_max, i.e. every
  // contributing hospital's sample_count was an exact count rather than a
  // de-identified range.
  bool total_sample_count_exact = 6;
  // The code's type (e.g. "CPT") - always set, and what disambiguates hits
  // when ListCodesRequest.code_type is left empty for a cross-type search
  // (#911).
  string code_type = 7;
  // LLM-normalized, human-readable description (#266) - empty when not yet
  // backfilled; fall back to raw_description. Searched alongside
  // raw_description by ListCodesRequest.query (#911).
  string friendly_description = 8;
}

message ListCodesResponse {
  repeated CodeSummary codes = 1;
  // Empty when there are no more results.
  string next_page_token = 2;
  // Total number of matching codes across all pages - see issue #163.
  int32 total_count = 3;
}

service HospitalCodeCostService {
  // Returns cost stats for the single hospital identified by hospital_id -
  // one result per requested methodology (HospitalCodeCostRequest.methodologies),
  // or one aggregate result when that filter is left empty. Requesting
  // several methodologies in one call avoids the 6x
  // (1-aggregate-plus-5-per-methodology) fan-out a methodology-breakdown
  // page previously needed (issue #627).
  rpc GetHospitalCodeCost (HospitalCodeCostRequest) returns (HospitalCostResult);
  // PROTOTYPE (#870): batch counterpart to GetHospitalCodeCost - prices
  // several (code_type, code) pairs for one hospital in a single call,
  // cutting the N-RPC fan-out a hospital-detail page's curated-procedure
  // cross-linking currently needs down to one.
  rpc BatchGetHospitalCodeCost (HospitalCodeCostBatchRequest) returns (HospitalCodeCostBatchResponse);
  // Returns cost stats for every hospital with a matching chargemaster entry
  // for (code_type, code), paginated - see issue #240.
  rpc ListHospitalCodeCosts (ListHospitalCodeCostsRequest) returns (ListHospitalCodeCostsResponse);
  // Returns every distinct code_type reporting data, for a /codes index page
  // - see issue #286.
  rpc ListCodeTypes (ListCodeTypesRequest) returns (ListCodeTypesResponse);
  // Returns every distinct code under a given code_type, paginated, for a
  // /codes/[codeType] index page - see issue #286.
  rpc ListCodes (ListCodesRequest) returns (ListCodesResponse);
}

