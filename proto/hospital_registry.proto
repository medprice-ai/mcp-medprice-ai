syntax = "proto3";
package ai.medprice.api;

import "scalapb/scalapb.proto";

option java_multiple_files = true;
option java_package = "ai.medprice.api";
option java_outer_classname = "HospitalRegistryProto";
option (scalapb.options) = {
  scala3_sources: true
};

// Geocoding precision for a Location's coordinates - see issue #190.
// LOCATION_PRECISION_STREET is a full street-address match;
// LOCATION_PRECISION_CITY is a fallback to a "city, state" query when the
// full address didn't resolve on OpenStreetMap/Nominatim;
// LOCATION_PRECISION_UNKNOWN covers both "not geocoded yet" (lat/lng absent)
// and coordinates imported from medprice-ai-web's pre-existing geocoded
// snapshot, which didn't record which tier each address resolved at. Values
// are prefixed with the enum name (not just STREET/CITY) since proto enum
// value names share scope with any sibling enum in the same package.
enum LocationPrecision {
  LOCATION_PRECISION_UNKNOWN = 0;
  LOCATION_PRECISION_STREET = 1;
  LOCATION_PRECISION_CITY = 2;
}

message Location {
  // Raw facility address string, as published in the hospital's own source
  // file - unchanged from what HospitalRecord.locations used to return
  // directly as a bare string.
  string address = 1;
  // Present (via proto3 field-presence tracking, not a sentinel value) only
  // once `address` has been geocoded - absent, with precision ==
  // LOCATION_PRECISION_UNKNOWN, for a brand-new hospital not yet covered by
  // the backfill, or a lookup that failed even the city/state fallback (see
  // issue #190).
  optional double lat = 2;
  optional double lng = 3;
  LocationPrecision precision = 4;
}

message HospitalRecord {
  // Opaque handle backed by public.hospital.id (DB primary key).
  string hospital_id = 1;
  // EIN — groups filings from the same legal entity (e.g. "46-4027347").
  string ein = 2;
  string hospital_name = 3;
  // Deprecated - use structured_locations instead. Kept, unchanged, for
  // existing callers of this public/unauthenticated endpoint (see CLAUDE.md)
  // that haven't migrated: field 4's wire type can't be silently swapped
  // from `repeated string` to an embedded message without risking a garbled
  // (not cleanly-erroring) parse for any client we don't control.
  repeated string locations = 4 [deprecated = true];
  // ISO-8601 date (e.g. "2025-01-01") the source file was last updated on.
  // Duplicates revisions' last (most recent) revision_date - kept for
  // backwards compatibility with existing clients.
  string last_updated_on = 5;
  // Every known revision of this hospital's filing (same ein + source_file,
  // one row per distinct last_updated_on it's been seen with), oldest first.
  // A hospital normally has one revision; systems like Medical City that have
  // re-filed under a newer CMS spec version will have more than one, letting
  // a client compare pricing across revision_dates (see issue #106).
  repeated HospitalRevisionRecord revisions = 6;
  // Structured replacement for `locations` (see issue #190) - same
  // addresses, plus geocoded coordinates where available.
  repeated Location structured_locations = 7;
}

message HospitalRevisionRecord {
  // ISO-8601 date (e.g. "2026-03-01") this revision's source file was last
  // updated on.
  string revision_date = 1;
  // Whether this revision's source file included any payer-specific
  // negotiated-rate data, as opposed to gross/cash price only (see #147).
  bool has_payer_data = 2;
}

message ListHospitalsRequest {
  // Maximum number of hospitals to return. Defaults to 20, capped at 100.
  int32 page_size = 1;
  // Opaque token returned by a previous ListHospitals call. Empty for the first page.
  string page_token = 2;
}

message ListHospitalsResponse {
  repeated HospitalRecord hospitals = 1;
  // Empty when there are no more results.
  string next_page_token = 2;
}

service HospitalRegistryService {
  rpc ListHospitals (ListHospitalsRequest) returns (ListHospitalsResponse);
}
